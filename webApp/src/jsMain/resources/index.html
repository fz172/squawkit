    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebApplication",

                "@type": "Offer",
                "price": "0",
                "priceCurrency": "USD"
            }
        }
    </script>
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "Organization",
            "name": "SquawkIt",
            "url": "https://squawkit.fanfly.dev/",
            "logo": "https://squawkit.fanfly.dev/favicon-192.png",
            "sameAs": [
                "https://apps.apple.com/app/squawkit",
                "https://play.google.com/store/apps/details?id=dev.fanfly.wingslog"
            ]
        }
    </script>
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "FAQPage",
            "mainEntity": [
                {
                    "@type": "Question",
                    "name": "Is SquawkIt a certified maintenance record system?",
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "No. SquawkIt is a personal convenience tool. It does not replace the official aircraft logbooks required by your aviation authority, or any other record you are required to keep — keep your certified records as you always have. Think of it as the heads-up layer that helps you stay ahead of them."
                    }
                },
                {
                    "@type": "Question",
                    "name": "Does SquawkIt work offline?",
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "Yes. SquawkIt is local-first, so your records are always available — in the hangar, the garage, or the marina, with no signal at all. Changes sync automatically in the background once you reconnect."
                    }
                },
                {
                    "@type": "Question",
                    "name": "How does exporting reports work?",
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "Export any Thing's records on demand — pick a date range and SquawkIt generates a clean PDF, CSV, and XLSX bundle covering inspections, tasks, issues, and completed work, with current readings and due dates. Download it or email a copy to a mechanic, a buyer, or your A&P for a pre-buy or annual. Your certified records stay the source of truth; the export is a convenient, up-to-date snapshot."
                    }
                },
                {
                    "@type": "Question",
                    "name": "What can I track?",
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "Aircraft (airframe, engine, propeller), cars and motorcycles, bikes, boats, homes, or anything else you maintain. Each kind of Thing comes with its own vocabulary, fields, and a recommended starter schedule. Tasks can recur by calendar time, by meter — engine hours, odometer, ride distance — or on condition."
                    }
                },
                {
                    "@type": "Question",
                    "name": "Which platforms is SquawkIt available on?",
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "SquawkIt runs on the web, iOS, and Android. Everything you track syncs across every device."
                    }
                }
            ]
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #F3EDF7; }
        @media (prefers-color-scheme: dark) {
            html, body { background: #211F26; }
        }
        #ComposeTarget { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>
<script>
    (function(){
        var m=localStorage.getItem('appearance_mode');
        if(m==='DARK'||m==='LIGHT'){
            var c=m==='DARK'?'#211F26':'#F3EDF7';
            document.documentElement.style.background=c;
            document.body.style.background=c;
        }
    })();
</script>

<!-- Crawlable fallback for non-JS agents (the app UI renders to a canvas once the bundle loads). -->
<noscript>
    <main style="max-width:760px;margin:0 auto;padding:48px 24px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#0E1726;background:#F8F9FC;overflow:auto;height:auto">
        <h1>SquawkIt — Maintenance records for everything you own, simplified</h1>
        <p>Track inspections, recurring tasks, and issues for your aircraft, car, boat, bike, or
            home, and share reports with others. SquawkIt is local-first, works offline, and syncs
            across every device. Free to start.</p>
        <h2>What it does</h2>
        <ul>
            <li>Inspection &amp; task tracking — by calendar time, by meter (engine hours,
                odometer), or on condition, counting down to every due date.
            </li>
            <li>Issue log — report what is wrong and track each item to resolution; anything that
                grounds the airplane or takes the car off the road surfaces first.
            </li>
            <li>A starter schedule for every kind of Thing, from an annual to a water-heater flush.</li>
            <li>On the web, iOS, and Android; export clean reports on demand.</li>
        </ul>
        <p>SquawkIt requires JavaScript to sign in. Please enable JavaScript to use the app.</p>
        <p><small>SquawkIt is a personal convenience tool and is not a certified maintenance record
            system. It does not replace the official aircraft logbooks required by your aviation
            authority, or any other record you are required to keep.</small></p>
    </main>
</noscript>

<div id="ComposeTarget"></div>
<script src="webApp.js"></script>
</body>
