# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
#
# 16g, not the 4g default: this project's Kotlin/Native compiler runs IN-PROCESS inside the
# Gradle daemon (confirmed via `ps` — no separate KotlinNativeCompilerDaemon process exists),
# so `kotlin.native.jvmArgs` has no effect here; this is the heap that actually matters for a
# release iOS framework link. The release build's whole-program static-initializer call-graph
# analysis (StaticInitializersOptimization) needs to hold the entire linked app's IR across
# every feature module at once, and 4g reliably OOMs partway through with "Compilation failed:
# Java heap space". The machine this was tuned on has 64GB; scale down if yours has less.
org.gradle.jvmargs=-Xmx16384m -Dfile.encoding=UTF-8
org.gradle.caching=true
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
android.nonTransitiveRClass=false
android.r8.strictFullModeForKeepRules=false
android.builtInKotlin=false
android.newDsl=false
android.dependency.excludeLibraryComponentsFromConstraints=true
