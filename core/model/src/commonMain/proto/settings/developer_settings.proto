syntax = "proto3";

option java_package = "dev.fanfly.wingslog.core.model.settings";
option java_multiple_files = true;

message DeveloperSettings {
  // 4 and 7 held export_email_delivery_enabled / attachment_upload_enabled — now gated by the
  // subscription (SubscriptionManager), so they were removed.
  reserved 1, 2, 3, 4, 5, 6, 7;
  reserved "technician_disabled", "attachment_upload_disabled", "export_logs_enabled", "account_upgrade_enabled", "adaptive_shell_enabled", "export_email_delivery_enabled", "attachment_upload_enabled";

  // Developer force-override of the effective subscription tier. UNSET = no override (the real
  // entitlement applies); SubscriptionManager honors this only in developer builds.
  ForceSubscriptionStatus force_subscription_status = 8;

  // Developer force-override that shows free-tier display ads regardless of the account's tier, so
  // placement can be exercised without a real free account. AdsManager honors this only in developer
  // builds, and only where the build supports ads at all — it overrides the tier check, never the
  // capability gate.
  bool force_ads = 9;

  // Registers this device as a UMP debug/test device so ConsentDebugSettings' DEBUG_GEOGRAPHY_EEA
  // override actually takes effect on it — Google's UMP SDK ignores debug geography on any device
  // it doesn't already recognize as a test device (emulators are exempt; physical devices are not).
  // Empty = unset. Find the value for a given physical device in Logcat (tag "Ump") the first time
  // ensureConsent() runs on it without this set: the SDK logs the exact
  // addTestDeviceHashedId(...) call to make with that device's hash.
  string ad_consent_test_device_hashed_id = 10;

  enum ForceSubscriptionStatus {
    FORCE_SUBSCRIPTION_STATUS_UNSET = 0;
    FORCE_SUBSCRIPTION_STATUS_FREE = 1;
    FORCE_SUBSCRIPTION_STATUS_PRO = 2;
  }
}
