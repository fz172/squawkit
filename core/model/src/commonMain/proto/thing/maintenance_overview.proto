syntax = "proto3";

import "thing/meter_reading.proto";

option java_package = "dev.fanfly.wingslog.thing";
option java_multiple_files = true;

/**
 * Summary data for an aircraft's maintenance history.
 * Used to avoid recomputing statistics from the full log list.
 */
message MaintenanceOverview {
  string aircraft_id = 1;
  uint32 total_log_count = 2;

  // Counts by component type
  uint32 airframe_log_count = 3;
  uint32 engine_log_count = 4;
  uint32 propeller_log_count = 5;
  reserved 9;
  reserved "avionics_log_count";

  // Current accumulated times. Aviation-only by construction and superseded by `current` below.
  //
  // The current reading for every meter this Thing's logs carry: the maximum per key (PRD §4.4).
  //
  // Replaced `current_airframe_time` (6), `current_engine_time` (7) and `current_propeller_time`
  // (8). A car's odometer had nowhere to go in three aviation doubles, which is why the dashboard
  // could ask for one and never be answered.
  repeated MeterReading current = 10;

  // Retired in #761 once the backfill rebuilt `current` for every stored overview. See
  // maintenance_log.proto for why the numbers are reserved rather than reused.
  reserved 6, 7, 8;
  reserved "current_airframe_time", "current_engine_time", "current_propeller_time";
}
