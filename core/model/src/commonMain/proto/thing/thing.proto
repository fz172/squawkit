syntax = "proto3";

import "thing/engine.proto";
import "thing/spec.proto";
import "thing/component.proto";
import "thing/template.proto";

option java_package = "dev.fanfly.wingslog.thing";
option java_multiple_files = true;

message Thing {
  string id = 1;

  // --- retired, never reuse (#668) ---
  //
  // 2-6 held make / model / serial / tail_number / engine. They were the aircraft-shaped identity
  // fields, and a house has none of them (PRD §4.2) — so they were always going to go once the
  // template system could describe a Thing generically.
  //
  // What replaced them: `spec` (10) holds the identity values by key, and `components` (11) holds
  // the part tree that `engine` used to. The four conventional spec keys — make, model, serial,
  // tail_number — survive as *conventions* an airplane template declares, not as schema.
  //
  // The order that made removing them safe, and why it took three steps rather than one:
  //   1. #717 — the client began writing spec/components on every write. Until then only the
  //      backend cutover ever had, so a Thing created after the cutover had neither.
  //   2. #718 — an audit confirmed zero Things were missing them, across every account, after a
  //      release carrying step 1 had reached every device. No backfill was ever needed.
  //   3. #668 — every reader, then the form and the fake-data generator, moved across; only then
  //      were these reserved.
  //
  // Reserved by number *and* by name so neither can be reintroduced with a different type. The
  // bytes still present in already-migrated documents decode as unknown fields and are retained
  // (`ThingUnknownFieldRetentionTest`), exactly as happened for 7 and 8.
  reserved 2, 3, 4, 5, 6;
  reserved "make", "model", "serial", "tail_number", "engine";

  // --- new, permanent ---
  // 7 and 8 held template_id / template_version. Removed once `template` (12) landed: a Thing
  // without DNA can only be one created before templates existed, and every one of those is an
  // airplane — a closed set, because any client able to create something else necessarily has
  // DNA support. So the fallback needs no stored hint. Reserved so the numbers are never reused;
  // the bytes still present in migrated documents decode as unknown fields and are retained.
  reserved 7, 8;
  reserved "template_id", "template_version";

  string name = 9;
  repeated Spec spec = 10;         // mirrors of make/model/serial/tail_number
  repeated Component components = 11;

  // The template this Thing was created from, inflated at creation and never a reference
  // (template_system_design.md §5). A Thing carries everything needed to render itself: no
  // lookup, no second document that can arrive late, and a share member gets it with the read
  // they already make.
  //
  // ABSENT on every Thing created before the template system existed. Those resolve through
  // `template_id` to the baked-in canonical, which is exactly right for them — a pre-template
  // Thing has no customisation to miss — and they are inflated on their next write (§5.3). That
  // is why fields 7 and 8 stay rather than being replaced by this one.
  ThingTemplate template = 12;
}
