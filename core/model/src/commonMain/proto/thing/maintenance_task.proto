syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "thing/attachment.proto";
import "thing/component_type.proto";
import "thing/meter_reading.proto";

option java_package = "dev.fanfly.wingslog.thing";
option java_multiple_files = true;

enum ComplianceType {
  COMPLIANCE_TYPE_ROUTINE_INSPECTION = 0;
  COMPLIANCE_TYPE_SERVICE_BULLETIN = 1;
  COMPLIANCE_TYPE_AIRWORTHINESS_DIRECTIVE = 2;
}

// A time-interval-based rule (e.g. every 12 months).
// Exactly one of interval_days / interval_months / interval_years is set.
// Older payloads only set interval_months — readers that see all three zero
// should treat months as the unit.
message TimeRule {
  int32 interval_months = 1;
  google.protobuf.Timestamp creation_date = 2;
  int32 interval_days = 3;
  int32 interval_years = 4;
}

// A engine-hour-based rule (e.g. every 100 hours).
//
// SUPERSEDED BY MeterRule. Kept because every aviation task in the field uses one, and a task that
// silently stops coming due is worse than one that cannot be created. Read both, write MeterRule.
message EngineHourRule {
  float interval_hours = 1;
}

// A rule against any meter the template declares — "every 5,000 miles", "every 100 hours",
// "every 200 ride hours". PRD §11.1.
//
// `EngineHourRule` could not express these because it named the meter in its type rather than
// carrying it: an interval with no unit is only a number, and a car could not be scheduled at all.
message MeterRule {
  // Matches MeterDef.key on the template, and MeterReading.meter_key on the logs it reads.
  string meter_key = 1;
  float interval = 2;
}

// Inspection is performed on condition (no fixed interval)
message OnConditionRule {
  string description = 1;
}

message LinkedRule {
  string parent_inspection_id = 1; // e.g., ID of the "Annual" card
}

message ImmediateRule {}

// A single rule governing when an inspection is due
message InspectionRule {
  oneof rule {
    TimeRule time_rule = 1;
    EngineHourRule engine_hour_rule = 2;
    OnConditionRule on_condition_rule = 3;
    LinkedRule linked_rule = 4;
    ImmediateRule immediate_rule = 5;
    MeterRule meter_rule = 6;
  }
}

// Status to track when an inspection was forcefully marked as complied with
message ForceCompliedStatus {
  google.protobuf.Timestamp complied_date = 1;
  // Superseded by `complied_meter`; still read for statuses recorded before it existed.
  float complied_engine_hours = 2;
  // What the meter read when this was marked complied, keyed. Empty key means none was recorded.
  MeterReading complied_meter = 3;
}

// A configured maintenance task card for an aircraft
message MaintenanceTask {
  string id = 1;
  string title = 2;
  ComponentType component = 3;
  repeated InspectionRule rules = 4;

  // Optional force overrides — when set, skip computed due calculation
  google.protobuf.Timestamp force_due_date = 5;
  // Superseded by `force_due_meter`; still read for overrides set before it existed.
  float force_due_engine_hour = 6;

  // Optional free-text notes or comments for this maintenance task
  string notes = 7;

  // v2 Compliance Tracking
  ComplianceType type = 8;
  string reference_number = 9; // e.g., "SB-2024-01"
  string compliance_authority = 10;
  string compliance_details = 11;
  bool is_one_time = 12; // If true, moves to history after first log
  repeated Attachment attachments = 13;

  ForceCompliedStatus force_complied_status = 14;

  // The meter reading this task is forced due at, keyed. Supersedes `force_due_engine_hour`, which
  // could only ever mean engine hours (PRD §11.1).
  MeterReading force_due_meter = 15;

}
