syntax = "proto3";

import "thing/capabilities.proto";
import "thing/lexicon.proto";

option java_package = "dev.fanfly.wingslog.thing";
option java_multiple_files = true;

// The template definition language. See docs/product/template_system_design.md.
//
// ONE MESSAGE, TWO LIFECYCLES (design §3, §5):
//
//   CANONICAL — global, immutable, identified by (id, version). Baked into the app as a binary
//   asset and served by the fetch RPC. Used for the picker and nothing else. A published
//   canonical template is NEVER edited; a change is a new `version`.
//
//   DNA — the copy inflated into a Thing at creation, carried on `Thing.template`. This is what
//   renders a Thing, and it is why a Thing is self-contained: no lookup, no second document to
//   arrive late, and a share member gets it with the read they already make.
//
// The distinction matters at every call site. Nothing resolves a canonical template at render
// time, which is why the canonical pool never has to keep old versions reachable.

// A field the user fills in on a Thing — make, model, serial, tail number, VIN, address.
// Deliberately template-declared rather than hardcoded: a house has no make, model, or serial
// (PRD §4.2), so make/model/serial survive only as conventional keys most presets happen to
// declare, not as a privileged core.
message SpecField {
  string key = 1;                 // matches Spec.key on the Thing
  string label = 2;
  bool required = 3;
  // Renders in a monospace face — VIN, tail number, serial, hull ID. A readability hint, not a
  // validation rule.
  bool is_identifier = 4;
  string placeholder = 5;

  // May share a line with the next field that also sets it — serial beside tail number, where
  // both are short and neither earns a row of its own.
  //
  // Stated per field rather than per template because spec fields are authored freely: a home's
  // address needs the full width and its year built does not, and no rule over key names knows
  // that. Components take a slot-level flag instead, since their field set is the fixed
  // make/model/serial triple.
  bool compact = 6;

  // May stand in as the Thing's display name when the user has not set one. PRD §4.2.
  //
  // Distinct from `is_identifier`, which says a value is matched exactly and renders in mono — an
  // airplane has two such fields and only the tail number is what an owner calls it by. Without
  // this the switcher picked whichever identifier the template happened to declare first.
  bool title_candidate = 7;

  // The values this field accepts. Empty — the default — means free text.
  //
  // A wheel's position is the case: front left, rear right, spare. Typed freely, the same wheel is
  // "RR", "rear right" and "Rear-Right" across three cars, and nothing can group or compare them.
  // The list is the TEMPLATE's, because the vocabulary is domain knowledge: a bike has a front and
  // a rear, a dually has an inner and an outer.
  repeated string options = 8;

  // A number: numeric keypad, and none of the capitalisation a text field applies.
  bool numeric = 9;

  // Capitalise every word, not just the first — a name, where each word is part of what the thing
  // is called. Ignored when `numeric` or `is_identifier` already decide the casing.
  bool title_case = 10;
}

// A slot in the component tree the template expects — airframe, engine, propeller, hub, blade.
// The Thing's actual Components reference these by `slot_key`.
message ComponentSlot {
  string slot_key = 1;
  string label = 2;
  bool repeatable = 3;                    // an airplane has N engines
  repeated ComponentSlot children = 4;    // engine -> propeller -> blade
  bool serial_expected = 5;

  // Which of make / model / serial this slot asks for. PRD §4.3's `spec_keys`.
  //
  // Empty means all three, so every preset that has not thought about it is unchanged. The case
  // that needs it: propeller blades are a matched set, so their make and model are the propeller's
  // and only the serials differ. Asking per blade invites data that cannot be true.
  repeated string spec_keys = 6;

  // Render this slot's fields inside its PARENT's card rather than a card of its own.
  //
  // Nesting stays the default — a card in a card is how the tree reads — but the depth at which
  // that stops helping is a property of the domain, not of the widget. A propeller is not a thing
  // an owner navigates *into*: it is part of how they describe the engine, so it flows underneath
  // the engine's own fields. Named for what it does rather than `nested`, because a proto3 bool
  // defaults to false and "nested by default" has to be the false case.
  bool inline_with_parent = 7;

  // Pack this slot's inputs onto shared lines instead of one per line.
  //
  // Make takes a line of its own — it is the manufacturer and reads as a heading for what follows
  // — while model and serial pair up beside each other. A slot whose only field is a serial packs
  // its *instances* instead, which is what puts four blade serials on two lines.
  bool compact_fields = 8;

  // Draw each of this slot's components as a chip beside its siblings, not as a card of its own.
  //
  // The slot says whether its parts are read as a SET or as individuals. Four tyres, two blades,
  // two wheels are a set — near-identical parts told apart by a number and a serial — and a
  // full-width card each buries the rest of the tree in scroll for no gain. An engine is an
  // individual: one part with a history, and its card is where that history hangs.
  //
  // Replaces the `depth > 0` heuristic the dashboard used to guess this with. Nesting was never
  // the question — a boat's propulsion and a car's tyres are top-level and still a set, which is
  // why a preset that reads correctly for an aeroplane listed a car's four tyres as four rows.
  // #732 asked for this field; this is it.
  bool compact_instances = 9;

  // How many components this slot may hold. 0 — the proto3 default — means unbounded, so every
  // preset that has not thought about it is unchanged.
  //
  // This is the ZERO_OR_ONE cardinality PRD §4.3 designed and the shipped bool could not express.
  // `repeatable` alone is a two-way switch: false means exactly one, which puts an unremovable
  // empty Engine block on an EV's form, and true means zero-or-more, which offers to add a second
  // engine to a hatchback. A car's engine is optional and singular, and needed a way to say both.
  //
  // Only meaningful with `repeatable` — a non-repeatable slot already holds exactly one.
  int32 max_instances = 10;

  // Fields this slot asks for BEYOND make, model and serial, stored in `Component.spec`.
  //
  // The triple is a floor, not the whole vocabulary. A tyre has a normal running pressure and a
  // position on the vehicle, and neither is a make, a model or a serial — they are what tells one
  // tyre from the other three. `spec_keys` could only ever subtract from the triple; this adds.
  //
  // Same message the Thing's own spec fields use, so labels, placeholders, `options` and
  // `title_candidate` all mean here what they mean there. A field marked `title_candidate` names
  // the instance: a wheel reads "FRONT LEFT" rather than "Tire 3", which is the point of
  // recording a position at all.
  repeated SpecField spec_fields = 11;
}

// A meter a Thing accumulates and rules can be written against — hours, miles, cycles, seasons.
// Generalises the aviation-only engine-hour concept: `float interval_hours` cannot express
// "every 3000 miles" because there is no unit in it (design §11.1).
message MeterDef {
  string key = 1;                 // "airframe_hours" · "odometer" · "cycles"
  string label = 2;
  string unit_label = 3;          // "hrs" · "mi" · "cycles"
  bool decimal = 4;               // hours take decimals; cycles do not
  // Which component slot this meter belongs to, empty for Thing-level meters. An engine's hours
  // are the engine's, not the airframe's, and a per-engine meter has to say so.
  string component_slot_key = 5;
}

// A task offered at creation so a new Thing is not an empty shell. PRD §4.9; the §13 metric that
// judges them is "≥ 60% of new Things accept at least one starter task."
message StarterTask {
  string title = 1;
  string description = 2;
  bool default_selected = 3;
  // The rule this task carries, expressed the same way MaintenanceTask does. Left as a free-form
  // key/interval pair here rather than embedding the rule oneof, so adding a rule kind to
  // MaintenanceTask does not force a template schema change.
  string meter_key = 4;
  float interval = 5;
  int32 interval_months = 6;
}

message ThingTemplate {
  string id = 1;       // "airplane" · "car" · "home" — stable across versions
  // Bumped on every publication. Immutable in the sense that (id, version) always names the same
  // bytes; a correction is a new version, never an edit (design §5).
  int32 version = 2;

  // versionCode floor from version.properties. A client refuses a canonical template above its
  // own build, so the picker never offers something it cannot render (design §6).
  //
  // This guards SEMANTICS, not parsing: proto3 round-trips unknown fields happily, so a client
  // decodes a future template perfectly and then renders it incoherently. Because the value is
  // author-set and a wrong one is silent, clients also refuse templates naming enum values they
  // do not recognise — a check that does not depend on anyone getting this number right.
  int32 min_app_version = 3;

  Lexicon lexicon = 4;
  Capabilities capabilities = 5;
  repeated SpecField spec_fields = 6;
  repeated ComponentSlot component_slots = 7;
  repeated MeterDef meters = 8;
  repeated StarterTask starter_tasks = 9;

  // How many fields of the user's own the form offers, beyond `spec_fields`. 0 — the proto3
  // default — means none, which is every preset that describes a real domain.
  //
  // `custom` is the case: it declares no spec fields at all, because what a user tracks under it
  // is not knowable in advance. The template still decides HOW MANY, so the answer is a number
  // here rather than an unbounded list the UI has to invent a limit for.
  int32 custom_spec_fields = 13;

  string display_name = 10;  // picker copy — "Airplane", "Car"
  string icon = 11;          // icon key the client maps to a vector
  int32 sort_order = 12;     // position in the picker
}
