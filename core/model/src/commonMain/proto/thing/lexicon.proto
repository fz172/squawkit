syntax = "proto3";

option java_package = "dev.fanfly.wingslog.thing";
option java_multiple_files = true;

// Every domain noun and status word a template supplies, so the same screens read correctly for
// an airplane, a boat, or a house. See docs/product/multi_domain_maintenance_PRD.md §4.5 and
// docs/product/template_system_design.md §5.
//
// One lexicon per template, resolved into a CompositionLocal at the Thing scope. Account-level
// screens (settings, the switcher, notification channel names) resolve the GENERIC lexicon
// instead — on a mixed account there is no single template whose word would be right.

// ENGLISH-ONLY by construction. Two plural forms cannot express Russian or Polish (three, by
// number), Arabic (a dual), or Chinese and Japanese (no inflection); CLDR defines six categories.
// `article` assumes one exists, precedes the noun, separates with a space, and does not inflect —
// false for Russian, for suffixing Swedish, and for gendered German and Spanish. See
// LexiconFormatter's header for why the ceiling is this message and the substitution model rather
// than the formatter, and what localisation would actually require.
message Noun {
  string singular = 1;
  string plural = 2;
  // "a" / "an". Stored rather than derived: English article selection is not a function of the
  // first letter — "an hour", "a unicycle" — and a wrong article is visible in every empty state.
  string article = 3;
}

/**
 * A compliance category, in the three forms the UI actually asks for.
 *
 * A plain string could not do the job: the task picker lists the plural ("Airworthiness
 * Directives (AD)") and the detail tab leads with the abbreviation ("AD (Airworthiness
 * Directive)"). Both forms are conventional in aviation and neither is derivable from the other.
 */
message ComplianceTerm {
  string singular = 1;      // "Airworthiness Directive"
  string plural = 2;        // "Airworthiness Directives"
  // May be empty. A home or car template has a mandatory-compliance concept with no abbreviation,
  // and the UI drops the parenthetical rather than rendering an empty one.
  string abbreviation = 3;  // "AD"
}

message Lexicon {
  // Field names here are the CODE vocabulary; their values are the user-facing words. A Lexicon
  // holding "attention" still lives in `squawk`, because that is what the concept is called
  // everywhere else in the codebase — CollectionKind.Squawk, SquawkPriority, the squawk proto.
  Noun thing = 1;       // aircraft · car · bike · boat · home · thing
  Noun squawk = 2;      // squawk · issue · fault · attention
  Noun task = 3;        // inspection · service · chore
  Noun log = 4;         // logbook entry · service record · work record
  Noun component = 5;   // component · part · system
  Noun technician = 6;  // mechanic · shop · person

  string ready_status = 7;  // "Airworthy" · "Ready" · "Good"

  // These two carry more weight than the rest of the block. Besides the Dashboard's alert
  // section they name the OS notification channel a user sees in their system settings, and the
  // title of every grounded-tier notification (PRD §8.5). That is the one place a lexicon string
  // escapes the app's own surfaces — which is why both are whole strings rather than
  // substitutions, and why the channel ID stays "GROUNDED" forever while only its display name
  // resolves from here. Renaming a channel ID drops every user's per-channel settings.
  string down_status = 8;       // "AOG" · "Dead in the water" · "Emergency"
  string down_status_long = 9;  // "Aircraft on ground" · "Out of service"

  string collection_label = 10;      // "Fleet" · "Garage" · "Stuff"
  // Field 11 and 12 were plain strings carrying only a singular. They could not render
  // "Airworthiness Directives (AD)" — which needs a plural and an abbreviation — so they are
  // replaced by ComplianceTerm below. Nothing has ever written a Lexicon: templates are baked into
  // the app and no Thing carries DNA yet, so this costs no migration and reserves rather than
  // reuses the numbers, the same call made for Thing.template_id.
  reserved 11, 12;
  string authority_label = 13;       // "FAA" · "NHTSA" · "Manufacturer"

  ComplianceTerm compliance_mandatory = 14;  // AD · safety recall · code violation
  ComplianceTerm compliance_advisory = 15;   // service bulletin · TSB · manufacturer notice
}
