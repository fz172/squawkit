syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "thing/attachment.proto";
import "thing/technician.proto";
import "thing/component_type.proto";
import "thing/meter_reading.proto";

option java_package = "dev.fanfly.wingslog.thing";
option java_multiple_files = true;

message MaintenanceLog {
  string id = 1;
  google.protobuf.Timestamp timestamp = 2;
  string technician_id = 3;
  string work_description = 4;

  ComponentType component_type = 5;

  string component_serial = 6; // References Engine/Prop/Blade Serial

  // Field 9 repurposed from repeated string attachment_urls.
  // Safe because no data was ever written to field 9 before this change.
  repeated Attachment attachments = 9;

  // Inspection cards associated with this log entry
  repeated string inspection_ids = 12;

  // Technician who performed the work
  Technician technician = 13;

  // Squawks addressed by this log entry
  repeated string squawk_ids = 14;

  // What the meters read when this work was done (PRD §4.4).
  //
  // The only place a reading lives. Replaced `engine_hour` (8), `airframe_time` (10) and
  // `prop_time` (11), which could only ever describe an aeroplane — a car's odometer had nowhere
  // to go, which is what made "every 5,000 miles" unexpressible.
  repeated MeterReading readings = 15;

  // Retired in #761 once every stored log carried the keyed form. Bytes written before that still
  // carry these numbers and decode as unknown fields, which is harmless — but reusing a number
  // would silently reinterpret them as the new field's type.
  reserved 8, 10, 11;
  reserved "engine_hour", "airframe_time", "prop_time";
}
