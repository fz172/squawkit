syntax = "proto3";

option java_package = "dev.fanfly.wingslog.task";
option java_multiple_files = true;

// Carried on ThingTemplate.starter_tasks (thing/template.proto) until the server's curated lists
// replace it (#1265, design §6.8). Lives beside the task it becomes. No proto `package`, so moving the file changes
// nothing on the wire or in a stored Thing.

// A task offered at creation so a new Thing is not an empty shell. PRD §4.9; the §13 metric that
// judges them is "≥ 60% of new Things accept at least one starter task."
message StarterTask {
    string title = 1;
    string description = 2;
    bool default_selected = 3;
    // The rule this task carries, expressed the same way MaintenanceTask does. Left as a free-form
    // key/interval pair here rather than embedding the rule oneof, so adding a rule kind to
    // MaintenanceTask does not force a template schema change.
    string meter_key = 4;
    float interval = 5;
    int32 interval_months = 6;
    // Which component slot the task is filed against, empty for a Thing-level task. Only the
    // airplane preset sets it: `MaintenanceTask.component` is the frozen airframe / engine /
    // propeller enum, and an annual filed against nothing would land in the form's picker with no
    // option selected. Same field, same meaning, as MeterDef.component_slot_key.
    string component_slot_key = 7;
    // Calendar-anchored months (1–12) — the task becomes a SeasonalRule instead of a TimeRule.
    // "Gutters in April and October" is a fact about the calendar, not about the last cleaning.
    repeated int32 months = 8;
}
