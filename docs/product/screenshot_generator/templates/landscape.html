<meta charset="utf-8">
<title>landscape</title>
<style>
  @font-face {
    font-family: 'Space Grotesk';
    font-weight: 700;
    font-style: normal;
    src: url(data:font/ttf;base64,__SG_BOLD__) format('truetype');
  }
  @font-face {
    font-family: 'JetBrains Mono';
    font-weight: 500;
    font-style: normal;
    src: url(data:font/ttf;base64,__JBM_MEDIUM__) format('truetype');
  }

  :root {
    --deep-navy: #001849;
    --aviation-blue: #1A5FAE;
    --panel-slate: #525E72;
    --bezel: #14141A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: __CANVAS_W__px;
    height: __CANVAS_H__px;
    overflow: hidden;
    background: #fff;
  }

  .canvas {
    position: relative;
    width: __CANVAS_W__px;
    height: __CANVAS_H__px;
    container-type: size;
  }

  .bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(70% 120% at 0% 15%, #E7EFFD 0%, transparent 55%),
      linear-gradient(120deg, #DCE7FC 0%, #F3F6FC 46%, #FDFCF9 100%);
  }

  /* Text column on the left; the device takes the right two thirds. */
  .headline {
    position: absolute;
    top: 12cqh;
    left: 5.5cqw;
    width: 44cqw;
    z-index: 4;
  }
  .headline .l1, .headline .l2 {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-weight: 700;
    font-size: calc(4.2cqw * __HEADLINE_SCALE__);
    line-height: 1.0;
    letter-spacing: -0.01em;
  }
  .headline .l1 { color: var(--deep-navy); }
  .headline .l2 { color: var(--aviation-blue); }

  .wordmark {
    position: absolute;
    left: 5.5cqw;
    bottom: 10cqh;
    z-index: 4;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    font-size: 1.5cqw;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--panel-slate);
  }
  .wordmark b { color: var(--aviation-blue); font-weight: 500; }

  .device {
    position: absolute;
    aspect-ratio: __DEVICE_ASPECT__;
    width: 72cqw;
    right: -8cqw;
    bottom: -10cqh;
    transform: rotate(-4deg);
    transform-origin: bottom right;
    background: var(--bezel);
    border-radius: 2.2cqw;
    border: 0.9cqw solid var(--bezel);
    box-shadow:
      0 3cqw 5cqw -1.5cqw rgba(0, 24, 73, 0.45),
      0 0.7cqw 0 rgba(255,255,255,0.08) inset;
    overflow: hidden;
    z-index: 2;
  }
  /* Stack: several devices, the front one lower-right, each one behind it
     stepping up and to the left so its header stays visible. */
  .stack .device {
    width: 58cqw;
    right: calc(-8cqw + var(--i) * 10cqw);
    bottom: calc(-10cqh + var(--i) * 12cqh);
    z-index: calc(3 - var(--i));
  }

  /* A landscape phone capture is unusual but allowed; give it phone bezels. */
  .device.phone {
    border-radius: 5cqw;
    border: 1.3cqw solid var(--bezel);
  }

  /* The screen fills the frame; the image covers it. */
  .screen {
    position: absolute;
    inset: 0;
    overflow: hidden;
    container-type: inline-size;
  }
  .screen img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: __OBJECT_POSITION__;
    display: block;
  }

  /* Derived iOS screen: shift the capture up past its Android status bar and draw an iOS bar over
     the strip that opens up. Sizes are iPhone 16 Pro Max points at 3x, as a fraction of width. */
  .screen.ios img {
    height: auto;
    margin-top: calc(var(--crop) * -1 + 12.3cqw);
  }
  .screen.ios .statusbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 12.3cqw;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 8cqw 0 8.5cqw;
    padding-top: 3.2cqw;
    color: #fff;
    fill: #fff;
    stroke: #fff;
    font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif;
    font-weight: 600;
    font-size: 4.1cqw;
    letter-spacing: -0.02em;
  }
  .screen.ios .icons { display: flex; align-items: center; gap: 1.6cqw; }
  .screen.ios .cell { width: 4.6cqw; height: 2.8cqw; }
  .screen.ios .wifi { width: 4.1cqw; height: 3.1cqw; }
  .screen.ios .battery { width: 6.8cqw; height: 3.2cqw; }

  /* Tablet capture taken outside demo mode: two patches, painted in the bar's own colour by the
     script below, cover the clock and the battery readout, and demo-mode glyphs sit on top.
     Sizes are iPadOS points at 2x, as a fraction of the capture width. */
  .screen .patch {
    position: absolute;
    top: 0;
    height: 2.3cqw;
    padding-top: 0.3cqw;
    display: flex;
    align-items: center;
    gap: 0.6cqw;
    color: #fff;
    fill: #fff;
    stroke: #fff;
    font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif;
    font-weight: 600;
    font-size: 1.24cqw;
    letter-spacing: -0.01em;
  }
  .screen .patch.clock { left: 1.5cqw; width: 12.5cqw; padding-left: 0.65cqw; }
  .screen .patch.clock .date { margin-left: 0.5cqw; }
  .screen .patch.status { right: 1.5cqw; width: 10cqw; justify-content: flex-end; padding-right: 0.6cqw; }
  .screen .patch .wifi { width: 1.3cqw; height: 1cqw; }
  .screen .patch .battery { width: 2.25cqw; height: 1.05cqw; }
  /* Android flavour: Roboto-weight clock and the Pixel battery pill. */
  .screen .patch.android { font-weight: 500; font-size: 1.16cqw; letter-spacing: 0; }
  .screen .patch .pill {
    background: #fff;
    color: var(--bezel);
    border-radius: 0.4cqw;
    padding: 0 0.28cqw;
    font-size: 0.92cqw;
    font-weight: 700;
    line-height: 1.05cqw;
  }
</style>

<div class="canvas __CANVAS_CLASS__">
  <div class="bg"></div>

  <div class="headline">
    <p class="l1">__HEADLINE_L1__</p>
    <p class="l2">__HEADLINE_L2__</p>
  </div>

  <p class="wordmark">Squawk<b>It</b> · __FEATURE_LABEL__</p>

__DEVICES__
</div>

<script>
  // Colour every painted status bar from the capture itself, so it matches the app's own top edge
  // (and any sheet scrim dimming it). data: images do not taint the canvas.
  addEventListener('load', () => {
    const sampler = (img) => {
      const c = document.createElement('canvas');
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0);
      return (x, y) => {
        const [r, g, b] = ctx.getImageData(Math.round(x), Math.round(y), 1, 1).data;
        return `rgb(${r},${g},${b})`;
      };
    };
    // Derived iPhone: the strip that used to be the Android status bar, sampled at its centre.
    document.querySelectorAll('.screen.ios').forEach((screen) => {
      const img = screen.querySelector('img');
      const crop = parseFloat(screen.style.getPropertyValue('--crop')) / 100 * img.naturalWidth;
      screen.querySelector('.statusbar').style.background = sampler(img)(img.naturalWidth / 2, crop / 2);
    });
    // Tablet patches: each one sampled just above its own text, in capture pixels.
    document.querySelectorAll('.screen .patch').forEach((patch) => {
      const screen = patch.parentElement;
      const img = screen.querySelector('img');
      const scale = img.naturalWidth / screen.clientWidth;
      const x = (patch.offsetLeft + patch.offsetWidth / 2) * scale;
      patch.style.background = sampler(img)(x, patch.offsetHeight * scale * 0.1);
    });
  });
</script>
